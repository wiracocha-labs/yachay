[workspace]
resolver = "2"
members = [
    "crates/yachay-core",
    "crates/yachay-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Wiracocha Labs"]
repository = "https://github.com/wiracocha-labs/yachay"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Configuración de dist (cargo-dist): releases multiplataforma para que
# nadie necesite Rust instalado — binarios + instaladores shell/powershell.
[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "skip"
install-path = "CARGO_HOME"
# Mensaje que imprimen los instaladores (shell y powershell) al terminar.
# Sin `$`, backticks ni comillas dobles: se escribe dentro del script.
install-success-msg = """
yachay installed. Next commands:

  yachay run      pick a model and download it
  yachay models   the curated catalog
  yachay ls       models already on this machine
  yachay --help   all commands and flags
"""

# `macos-14` fue retirado por GitHub el 2026-11-02 y dist 0.33 lo sigue
# emitiendo por defecto para arm64: el job muere sin runner y cancela el run.
[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
