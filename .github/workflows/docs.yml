# Renderiza la documentación del crate núcleo con rustdoc (`cargo doc`) y la
# publica en GitHub Pages.
#
# Requisito de una sola vez: en Settings → Pages, elegir "GitHub Actions"
# como Source. Sin eso el job `deploy` falla.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `yachay-core` es la librería: su API es lo que vale documentar.
      # `--no-deps` evita generar docs de serde, sysinfo, etc.
      - run: cargo doc --no-deps -p yachay-core
      # GitHub Pages necesita un index.html en la raíz del artefacto.
      - name: Redirigir la raíz a yachay_core
        run: |
          echo '<meta http-equiv="refresh" content="0; url=yachay_core/index.html">' \
            > target/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
