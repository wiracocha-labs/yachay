# Barrera de calidad: nada llega a `main` ni a un tag sin pasar estos checks.
#
# No corre en releases: `release.yml` (cargo-dist) compila los 5 targets y
# publica al pushear un tag. Este workflow es el que evita tagear código roto.
name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      # `-D warnings` también convierte en error el lint `missing_docs` que
      # activa yachay-core, así que la documentación no se erosiona en silencio.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace
